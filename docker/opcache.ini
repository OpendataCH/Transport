; Opcache settings for the container image.
;
; The filesystem inside the image never changes, so there is nothing to
; revalidate: validate_timestamps=0 removes a stat() per included file per
; request. A new build is a new image, which is the only way the code changes.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
