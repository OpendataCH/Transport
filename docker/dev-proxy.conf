# The development counterpart of the vhost on the servers: one hostname, two
# services, chosen by path prefix. It exists so that the split can be seen and
# broken on a laptop rather than only in production.
#
# Since stage S6 the split is the other way round from how it began: /v1 - the
# name every client uses - goes to the Python service, and the PHP one keeps
# answering under /v1-old so the two can still be compared. The website around
# the API stays with PHP.
#
# The forwarded headers are not decoration. The caller's IP address and
# User-Agent are what search.ch applies its rate limiting to, so a proxy that
# drops them puts every caller in the world into one bucket.

upstream php {
    server web:80;
}

upstream service {
    server service:8000;
}

server {
    listen 80;
    server_name _;

    # The previous implementation, reachable but unrouted from the name
    # clients use. It knows nothing of this prefix, so the path is put back
    # before it is asked.
    location /v1-old/ {
        rewrite ^/v1-old/(.*)$ /v1/$1 break;
        proxy_pass http://php;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /v1/ {
        proxy_pass http://service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /v2/ {
        proxy_pass http://service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else - the documentation, the examples, the showcase - is the
    # website around the API, and it is still the PHP container's.
    location / {
        proxy_pass http://php;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
