# Development only. The servers run their own compose file with images pulled
# from the registry; this one builds from the working copy.
#
# One service answers everything - the API under /v1 and the website around
# it - and Redis holds the counters behind /stats.php.
services:
  service:
    build: ./service
    ports:
      - "8000:8000"
    environment:
      SERVICE_VERSION: dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
