<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Transport</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E61414" />

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../media/css/base.css" />
    <link rel="stylesheet" href="../media/css/layout.css" />

    <style>
        :root {
            --ink: #383a3d;
            --muted: #767a80;
            --line: #e2e4e7;
            --surface: #f6f7f8;
            --red: #a20d0d;
            --long-distance: #c60018;
            --regional: #2d327d;
            --local: #5a5f66;
            --late: #c60018;
        }

        /* Bootstrap's .form-control sets display, which beats the attribute. */
        [hidden] { display: none !important; }

        .search {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .search .swap {
            width: 34px;
            height: 34px;
            padding: 0;
            font-size: 18px;
            line-height: 1;
        }
        .search .via-row { grid-column: 1 / -1; }
        .when {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 24px;
        }
        .when input[type=date] { width: 11em; }
        .when input[type=time] { width: 7.5em; }
        .when .btn-group .btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
        .when .spacer { flex: 1; }
        .link-button { background: none; border: 0; padding: 0; color: #337ab7; }
        .sharing { font-weight: normal; margin: 0; }

        #summary { color: var(--muted); margin-bottom: 12px; }
        #summary strong { color: var(--ink); font-weight: 600; }

        .day {
            margin: 18px 0 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .connection {
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }
        .connection > button {
            display: block;
            width: 100%;
            padding: 12px 16px 10px;
            background: none;
            border: 0;
            text-align: left;
            color: var(--ink);
        }
        .connection > button:hover { background: var(--surface); }
        .connection.open > button { border-bottom: 1px solid var(--line); }
        .head { display: flex; align-items: center; gap: 6px; font-size: 16px; margin-bottom: 8px; }
        .head .line { font-weight: 700; white-space: nowrap; }
        .head .towards { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .head .meta { margin-left: auto; display: flex; align-items: baseline; gap: 6px; }
        .head .changes { color: var(--muted); font-size: 13px; white-space: nowrap; }
        .row { display: flex; align-items: center; gap: 10px; }
        .row .t { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .track { flex: 1; display: flex; align-items: center; min-width: 0; }
        .seg { display: flex; align-items: center; min-width: 30px; position: relative; container-type: inline-size; --ico: 26px; }
        .seg .bar { flex: 1; height: 2px; background: var(--ink); margin: 0 2px; }
        .seg.walk .bar { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); }
        .ico {
            flex: 0 0 auto;
            width: 26px; height: 26px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: #fff;
        }
        .ico svg { width: 16px; height: 16px; }
        .ico.walk { border-color: var(--muted); color: var(--muted); }
        .ico.flat { border: 0; width: 20px; height: 20px; }
        .chevron { color: var(--muted); transition: transform .15s; margin-left: 4px; }
        .connection.open .chevron { transform: rotate(180deg); }
        @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
        .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }

        .badge-product {
            display: inline-block;
            min-width: 2.4em;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            color: #fff;
            background: var(--local);
            white-space: nowrap;
        }
        .badge-product.long-distance { background: var(--long-distance); }
        .badge-product.regional { background: var(--regional); }

        /* Expected occupancy, as the railways forecast it: three people per
           class, as many dark as it is full. */
        .occupancy { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); font-size: 13px; }
        .occupancy .class { display: inline-flex; align-items: center; gap: 1px; }
        .occupancy svg { width: 8px; height: 14px; fill: var(--line); }
        .occupancy svg.on { fill: var(--ink); }
        .occupancy .class.full svg.on { fill: var(--late); }
        .ride .occupancy { margin-left: 8px; }
        /* In the overview each ride shows its occupancy below its own stretch
           of the line; a short stretch keeps 2nd class only, or nothing. */
        .seg-load { position: absolute; top: calc(100% + 6px); left: calc(50% + var(--ico) / 2); transform: translateX(-50%); line-height: 18px; }
        @container (max-width: 150px) { .seg-load .class:first-child { display: none; } }
        @container (max-width: 80px) { .seg-load { display: none; } }
        .head .price { color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
        .head .price small { color: var(--muted); font-weight: normal; }

        .late { color: var(--late); font-weight: 600; font-size: .85em; }
        .changed { color: var(--late); }
        .muted { color: var(--muted); }

        .legs { list-style: none; margin: 0; padding: 14px 16px 16px; }
        .legs > li { display: grid; grid-template-columns: 4.2em 22px 1fr auto; column-gap: 10px; }
        .legs .t { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; color: var(--muted); padding-top: 1px; }
        .legs .stop .t { color: var(--ink); }
        .legs .rail { position: relative; display: flex; justify-content: center; }
        .legs .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--regional); }
        .legs .walk .rail::before { width: 0; border-left: 2px dotted var(--muted); }
        .legs .stop .rail::after {
            content: ""; position: relative; z-index: 1; margin-top: 4px;
            width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid var(--regional);
        }
        .legs .stop.first .rail::before { top: 10px; }
        .legs .stop.last .rail::before { bottom: calc(100% - 10px); }
        .legs .stop .name { font-weight: 600; }
        .legs .pl { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
        .legs .ride { padding: 8px 0 12px; color: var(--muted); font-size: 14px; }
        .legs .ride .ico { width: 22px; height: 22px; vertical-align: middle; margin-right: 4px; }
        .legs .ride .ico svg { width: 14px; height: 14px; }
        .legs .ride strong { color: var(--ink); }
        .legs .stops-toggle { display: inline-block; margin-top: 6px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: #337ab7; font-size: 13px; }
        .legs .between { list-style: none; padding: 4px 0 0; margin: 0; font-size: 13px; }
        .legs .between li { display: flex; gap: 10px; }
        .legs .between .bt { width: 3em; font-variant-numeric: tabular-nums; }
        .transfer { margin: 0 0 10px 6.3em; font-size: 12px; color: var(--muted); display: block !important; }
        .transfer .late { font-size: inherit; }

        .more { display: flex; justify-content: space-between; margin: 12px 0; }
        .loading { color: var(--muted); padding: 12px 0; }

        @media (max-width: 639px) {
            .row .t { font-size: 16px; }
            .ico { width: 22px; height: 22px; }
            .ico svg { width: 13px; height: 13px; }
            .seg { min-width: 22px; --ico: 22px; }
            .when .spacer { display: none; }

            /* Phone: line and destination take the first line of the card
               head, changes and price go to a second one below. */
            .head { flex-wrap: wrap; row-gap: 2px; }
            .head .towards { flex: 1 1 0; min-width: 0; }
            .head .meta { flex: 0 0 100%; padding-left: 26px; }
            .head .price { margin-left: auto; }

            /* Phone: from and to stacked, the swap button beside both,
               as in the timetable apps people know. */
            .search { grid-template-columns: 1fr auto; row-gap: 6px; }
            .search [name=from] { grid-column: 1; grid-row: 1; }
            .search [name=to] { grid-column: 1; grid-row: 2; }
            .search .swap { grid-column: 2; grid-row: 1 / span 2; height: 100%; min-height: 40px; }
            .search .swap span { display: inline-block; transform: rotate(90deg); }
            .search .via-row { grid-row: 3; }
            .search input.form-control, .when input.form-control { height: 40px; font-size: 16px; }

            /* Date, time and "now" on one line; the rest full width below. */
            .when { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
            .when input[type=date], .when input[type=time] { width: 100%; min-width: 0; }
            .when #now { height: 40px; }
            .when .btn-group { grid-column: 1 / -1; display: flex; }
            .when .btn-group .btn { flex: 1; }
            .when .sharing { grid-column: 1 / -1; }
            .when [type=submit] { grid-column: 1 / -1; padding: 10px; font-size: 16px; }
        }
            .api-panel { background: var(--surface, #f6f7f8); border: 1px solid var(--line, #e2e4e7); border-radius: 6px; padding: 10px 14px; margin: 8px 0 16px; font-size: 13px; }
        .api-panel code { word-break: break-all; }

        /* The journey on a map: the list beside the map, a rider on it. */
        .map-bar { padding: 10px 16px 0; }
        .play-map { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; }
        .play-map:hover { border-color: var(--ink); }
        .play-map .tri { width: 0; height: 0; border-left: 8px solid var(--long-distance); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
        .with-map { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); align-items: start; }
        .with-map > .map-bar { grid-column: 1 / -1; }
        .with-map > .legs { grid-column: 1; grid-row: 2; }
        .with-map > .trip-stage { grid-column: 2; grid-row: 2; position: sticky; top: 8px; padding: 14px 16px 16px 0; }
        .map-wrap { position: relative; }
        .trip-map.flying .leaflet-overlay-pane, .trip-map.flying .leaflet-tooltip-pane { opacity: 0; }
        .trip-map .leaflet-overlay-pane, .trip-map .leaflet-tooltip-pane { transition: opacity .35s; }
        .trip-map .leaflet-container, .trip-map.leaflet-container { background: #ebebeb; }
        .big-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: none; padding: 0; }
        .big-play .disc { width: 72px; height: 72px; border-radius: 50%; background: var(--long-distance); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,.3); transition: transform .15s; }
        .big-play .disc svg { width: 30px; height: 30px; fill: currentColor; margin-left: 4px; }
        .big-play .label { background: #fff; color: var(--ink); font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
        .big-play:hover .disc { transform: scale(1.08); }
        .big-play.docked { top: auto; left: 12px; bottom: 12px; transform: none; flex-direction: row; }
        .big-play.docked .disc { width: 40px; height: 40px; }
        .big-play.docked .disc svg { width: 18px; height: 18px; margin-left: 2px; }
        .with-map .legs [data-at], .with-map .legs [data-section] { cursor: pointer; }
        .with-map .legs .stop[data-at]:hover .name, .with-map .legs .between li:hover { text-decoration: underline; }
        .with-map .legs li[data-section]:not(.walk):hover .rail::before { width: 6px; }
        .with-map .legs li[data-section].walk:hover .rail::before { border-left-width: 4px; }
        .spot-icon span { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--long-distance); border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(198,0,24,.6); animation: spot 1.4s ease-out infinite; }
        @keyframes spot { to { box-shadow: 0 0 0 16px rgba(198,0,24,0); } }
        .trip-map { height: 440px; border: 1px solid var(--line); border-radius: 6px; background: #f2f2f2; }
        .hud { margin-top: 8px; font-size: 13px; }
        .hud .controls { display: flex; align-items: center; gap: 8px; }
        .hud .controls input[type=range] { flex: 1; min-width: 0; accent-color: var(--long-distance); }
        .hud .clock { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
        .hud .round { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
        .hud .round svg { width: 16px; height: 16px; fill: currentColor; }
        .hud .now-doing { margin: 6px 0; color: var(--ink); min-height: 1.4em; }
        .hud .now-doing .muted { color: var(--muted); }
        .hud .options { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .hud .chip { padding: 1px 9px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--muted); font-size: 12px; }
        .hud .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
        .hud .chip.live[aria-pressed=true] { background: var(--late); border-color: var(--late); }
        .legs > li.now .ride { color: var(--ink); }
        .legs > li.now .rail::before { width: 5px; background: var(--long-distance); }
        .legs > li.now.walk .rail::before { width: 0; border-left: 3px dotted var(--long-distance); }

        /* The rider: a disc with the vehicle's icon, its line on a tag. */
        .rider-icon { background: none; border: 0; }
        .rider { position: relative; width: 36px; height: 36px; }
        .rider .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--tone, var(--ink)); color: #fff; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
        .rider .disc svg { width: 20px; height: 20px; transition: transform .25s; }
        .rider.west .disc svg { transform: scaleX(-1); }
        .rider .tag { position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
        .rider .tag .late { font-size: inherit; }
        .rider.walk .disc { background: #fff; color: var(--ink); border-color: var(--ink); }
        .rider.moving.walk .disc { animation: step .42s ease-in-out infinite alternate; }
        .rider.moving:not(.walk) .disc { animation: rumble .3s linear infinite; }
        .rider.idle .disc { animation: breathe 1.6s ease-in-out infinite; }
        .rider.pop .disc { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
        .rider.arrived .disc { background: var(--long-distance); }
        .rider.arrived::before, .rider.arrived::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--long-distance); animation: ring 1.4s ease-out infinite; }
        .rider.arrived::after { animation-delay: .7s; }
        @keyframes step { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-5px) rotate(6deg); } }
        @keyframes rumble { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(.6px, -.6px); } 75% { transform: translate(-.6px, .6px); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
        @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(2.6); opacity: 0; } }
        .stop-label { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; font-weight: 600; box-shadow: none; }
        .stop-label::before { display: none; }
        @media (prefers-reduced-motion: reduce) {
            .rider .disc, .rider.arrived::before, .rider.arrived::after, .spot-icon span { animation: none !important; }
        }
        @media (max-width: 767px) {
            .with-map { grid-template-columns: minmax(0, 1fr); }
            .with-map > .trip-stage { grid-column: 1; grid-row: 2; position: static; padding: 10px 12px 0; }
            .with-map > .legs { grid-row: 3; }
            .trip-map { height: 320px; }
        }
    </style>
</head>

<body>

<div class="container">
    <header>
        <h1><a href="../"><img class="logo" src="/media/images/logo.svg" alt="" />Transport</a></h1>
        <p>Swiss public transport API</p>
    </header>

    <p class="pull-right">
        <button type="button" class="btn btn-link" id="api-link" aria-expanded="false" aria-controls="api-panel" hidden>
            <span class="glyphicon glyphicon-link"></span>
            API request
        </button>
        <a class="btn btn-link" href="https://gitlab.com/opendata.ch/Transport/-/blob/master/service/transport_api/site/examples/connections.html" target="_blank" rel="noopener">
            <span class="glyphicon glyphicon-new-window"></span>
            Source Code
        </a>
    </p>
    <h3>Connection Search Example</h3>
        <div class="api-panel" id="api-panel" hidden>
            <p>Everything on this page runs in the browser against the public API: <code>/locations</code> for the suggestions, <code>/connections</code> for the results.</p>
            <p><a id="api-url" href="#" rel="noopener" target="_blank"><code id="api-code"></code></a></p>
        </div>
    <br>

    <form id="search" autocomplete="off">
        <div class="search">
            <input class="form-control" name="from" list="from-list" placeholder="From: stop or address" aria-label="From" required />
            <button type="button" class="btn btn-default swap" title="Swap" aria-label="Swap from and to"><span>⇄</span></button>
            <input class="form-control" name="to" list="to-list" placeholder="To: stop or address" aria-label="To" required />
            <div class="via-row">
                <button type="button" class="link-button" id="add-via">+ Via</button>
                <input class="form-control" name="via" list="via-list" placeholder="Via (optional)" aria-label="Via" hidden />
            </div>
        </div>
        <datalist id="from-list"></datalist>
        <datalist id="to-list"></datalist>
        <datalist id="via-list"></datalist>

        <div class="when">
            <input class="form-control" type="date" name="date" aria-label="Date" />
            <input class="form-control" type="time" name="time" aria-label="Time" />
            <button type="button" class="btn btn-default" id="now">Now</button>
            <div class="btn-group" role="group" aria-label="Departure or arrival">
                <button type="button" class="btn btn-default active" data-arrival="0">Departure</button>
                <button type="button" class="btn btn-default" data-arrival="1">Arrival</button>
            </div>
            <label class="sharing" title="Shared bikes, scooters and cars to and from the stops (sharedmobility.ch)"><input type="checkbox" name="sharing"> bikes &amp; scooters</label>
            <button type="submit" class="btn btn-primary">Search</button>
            <span class="spacer"></span>
        </div>
    </form>

    <p id="error" class="text-danger" hidden></p>
    <div id="summary" hidden></div>
    <div class="more" id="earlier-row" hidden><button type="button" class="link-button" id="earlier">↑ Earlier connections</button></div>
    <div id="results"></div>
    <div class="more" id="later-row" hidden><span></span><button type="button" class="link-button" id="later">Later connections ↓</button></div>
    <div class="loading" id="loading" hidden>Searching…</div>

    <footer class="footer">
        <hr>
        <p>Powered by <a href="https://opendata.ch/">Opendata.ch</a> · <a href="/privacy.html">Privacy policy</a> · <a href="/licenses.html">Licenses</a></p>
    </footer>
</div>

<script>
(function () {
    'use strict';

    var form = document.getElementById('search');
    var results = document.getElementById('results');
    var field = function (name) { return form.elements[name]; };
    var arrival = false;
    // What is on screen: the connections, and the question that found them.
    var shown = [];
    // Read before the address is rewritten by the first search.
    var openOnLoad = parseInt(new URLSearchParams(location.search).get('open'), 10) || 0;
    var asked = null;
    var mapOnLoad = new URLSearchParams(location.search).get('map') === '1';

    // Categories that run between cities, drawn red as on the station
    // displays; S-Bahn and regional trains blue; everything else grey.
    var LONG_DISTANCE = ['IC', 'ICE', 'ICN', 'IR', 'IRE', 'EC', 'EN', 'TGV', 'RJ', 'RJX', 'NJ', 'PE', 'GEX', 'BEX', 'VAE', 'EXT', 'CNL'];
    var REGIONAL = ['S', 'SN', 'R', 'RE', 'RB', 'TER', 'PE'];

    function el(tag, attributes, children) {
        var node = document.createElement(tag);
        Object.keys(attributes || {}).forEach(function (key) {
            if (key === 'text') node.textContent = attributes[key];
            else node.setAttribute(key, attributes[key]);
        });
        (children || []).forEach(function (child) {
            if (child) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
        });
        return node;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

    // The API writes "2026-10-04T21:39:00+0200"; Safari wants "+02:00".
    function parse(value) {
        return value ? new Date(value.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')) : null;
    }
    function clock(value) { var d = parse(value); return d ? hhmm(d) : ''; }

    // "00d01:34:00" -> "1 h 34 min", "00d00:45:00" -> "45 min"

    function scenesOf(connection) {
        var scenes = [];
        var sections = connection.sections || [];
        var last = null;    // {t, at}: where and when the previous part ended

        function push(scene) {
            scene.t0 = scene.keys[0].t;
            scene.t1 = scene.keys[scene.keys.length - 1].t;
            scenes.push(scene);
            last = {t: scene.t1, at: scene.path.points[scene.path.points.length - 1]};
        }

        function between(to, tUntil, index) {
            if (!last) return;
            var gap = tUntil - last.t;
            var p = path([last.at, to]);
            // A gap of a few metres and under a minute is no part of its own.
            if (gap < 60000 && p.length < 80) return;
            // After a ride it is a change; after a walk, waiting for the next.
            var before = scenes[scenes.length - 1];
            var change = before && before.type === 'section' && before.data.journey;
            // Walk over at a stroll, then wait.
            var walking = Math.min(Math.max(gap, 0), p.length / 1.2 * 1000);
            var keys = [{t: last.t, d: 0}, {t: last.t + walking, d: p.length}];
            if (tUntil > keys[1].t) keys.push({t: tUntil, d: p.length});
            push({type: change ? 'change' : 'wait', kind: p.length > 30 ? 'walk' : 'wait', tone: 'walk', path: p, keys: keys, section: index});
        }

        sections.forEach(function (section, index) {
            var start = expected(section.departure, 'departure');
            var end = section.arrival ? expected(section.arrival, 'arrival') : null;
            var points = section.geometry ? decode(section.geometry.polyline, section.geometry.precision) : [];
            var stops = section.journey ? (section.journey.passList || []) : [section.departure, section.arrival];
            if (points.length < 2) {
                points = stops.map(coordinate).filter(Boolean);
            }
            if (!points.length) return;
            if (start == null) start = last ? last.t : null;
            if (start == null) return;
            if (end == null || end < start) end = start;
            between(points[0], start, index);
            if (last && start < last.t) start = last.t;
            var p = path(points);
            var keys;
            if (!section.journey) {
                // A walk takes its own duration, then waits for what comes next.
                var walking = section.walk && section.walk.duration ? section.walk.duration * 1000 : end - start;
                var arrive = Math.min(end, start + walking);
                keys = [{t: start, d: 0}, {t: Math.max(arrive, start + 1), d: p.length}];
                if (end > keys[1].t) keys.push({t: end, d: p.length});
            } else {
                // A ride stops at each stop of its pass list, at its times.
                keys = [];
                var from = 0;
                stops.forEach(function (stop, k) {
                    var c = coordinate(stop);
                    if (!c) return;
                    var best = from, bestD = Infinity;
                    for (var i = from; i < p.points.length; i++) {
                        var d = metres(p.points[i], c);
                        if (d < bestD) { bestD = d; best = i; }
                    }
                    from = best;
                    var d0 = p.cum[best];
                    var a = k === 0 ? start : expected(stop, 'arrival');
                    var b = k === stops.length - 1 ? end : expected(stop, 'departure');
                    [a, b].forEach(function (t) {
                        if (t == null) return;
                        var prev = keys[keys.length - 1];
                        if (prev && (t < prev.t || d0 < prev.d)) return;
                        keys.push({t: t, d: d0});
                    });
                });
                if (!keys.length || keys[0].t > start) keys.unshift({t: start, d: 0});
                var tail = keys[keys.length - 1];
                if (tail.d < p.length || tail.t < end) keys.push({t: Math.max(end, tail.t), d: p.length});
            }
            push({
                type: 'section', kind: kindOf(section), tone: toneOf(section), path: p, keys: keys,
                section: index, data: section
            });
        });

        // Screen time: grows with the square root of the minutes, within bounds.
        var screen = 0;
        scenes.forEach(function (scene) {
            var minutes = Math.max(0, (scene.t1 - scene.t0) / 60000);
            var seconds = scene.type !== 'section'
                ? Math.min(4, Math.max(1, 0.8 * Math.sqrt(minutes)))
                : Math.min(14, Math.max(2, 1.6 * Math.sqrt(minutes)));
            scene.s0 = screen;
            scene.s1 = screen += seconds;
        });
        return scenes;
    }

    function distanceAt(scene, t) {
        var keys = scene.keys;
        if (t <= keys[0].t) return keys[0].d;
        for (var i = 1; i < keys.length; i++) {
            if (t <= keys[i].t) {
                var a = keys[i - 1], b = keys[i], span = b.t - a.t;
                return span > 0 ? a.d + (b.d - a.d) * (t - a.t) / span : b.d;
            }
        }
        return keys[keys.length - 1].d;
    }

    var PLAY = '<path d="M7 4l13 8l-13 8z"/>';
    var PAUSE = '<path d="M6 4h4v16h-4zM14 4h4v16h-4z"/>';
    var REPLAY = '<path d="M12 4a8 8 0 1 1 -7.4 5h3a5.2 5.2 0 1 0 4.4 -2.4v3l-5 -4.5l5 -4.5z"/>';
    function glyph(paths) {
        var svg = document.createElementNS(SVG, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.innerHTML = paths;
        return svg;
    }

    // The button that opens the map, above a connection's legs.
    function mapBar(connection, details, list) {
        var button = el('button', {type: 'button', class: 'play-map'}, [el('span', {class: 'tri'}), 'Play the journey on a map']);
        var bar = el('div', {class: 'map-bar'}, [button]);
        button.addEventListener('click', function () {
            if (details.classList.contains('with-map')) return;
            button.disabled = true;
            loadLeaflet().then(function (L) {
                bar.hidden = true;
                details.classList.add('with-map');
                var stage = el('div', {class: 'trip-stage'});
                details.insertBefore(stage, list);
                player(L, connection, stage, list);
                stage.scrollIntoView({behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'nearest'});
                var box = details.parentNode;
                var params = new URLSearchParams(location.search);
                params.set('open', String(parseInt(box.getAttribute('data-index'), 10) + 1));
                params.set('map', '1');
                history.replaceState({}, '', '?' + params);
            }).catch(function (error) {
                button.disabled = false;
                fail(error);
            });
        });
        return bar;
    }

    function player(L, connection, stage, list) {
        var scenes = scenesOf(connection);
        if (!scenes.length) {
            stage.appendChild(el('p', {class: 'muted', text: 'No positions known for this connection.'}));
            return;
        }
        var total = scenes[scenes.length - 1].s1;
        var start = scenes[0].t0, end = scenes[scenes.length - 1].t1;

        var mapNode = el('div', {class: 'trip-map', role: 'region', 'aria-label': 'Map of the journey'});
        var playButton = el('button', {type: 'button', class: 'round', 'aria-label': 'Play'}, [glyph(PLAY)]);
        var slider = el('input', {type: 'range', min: '0', max: '1000', value: '0', 'aria-label': 'Time in the journey'});
        var clockNode = el('span', {class: 'clock'});
        var doing = el('div', {class: 'now-doing', 'aria-live': 'polite'});
        var speeds = [1, 2, 4].map(function (n) {
            return el('button', {type: 'button', class: 'chip', 'aria-pressed': n === 1 ? 'true' : 'false', 'data-speed': String(n), text: n + '×'});
        });
        var followChip = el('button', {type: 'button', class: 'chip', 'aria-pressed': 'true', text: 'Follow'});
        var liveChip = el('button', {type: 'button', class: 'chip live', 'aria-pressed': 'false', text: '● Now', title: 'Where the journey is now, in real time'});
        var bigPlay = el('button', {type: 'button', class: 'big-play'}, [el('span', {class: 'disc'}, [glyph(PLAY)]), el('span', {class: 'label', text: 'Play the journey'})]);
        stage.appendChild(el('div', {class: 'map-wrap'}, [mapNode, bigPlay]));
        stage.appendChild(el('div', {class: 'hud'}, [
            el('div', {class: 'controls'}, [playButton, slider, clockNode]),
            doing,
            el('div', {class: 'options'}, speeds.concat([followChip, liveChip]))
        ]));

        var map = L.map(mapNode, {zoomSnap: 0.25, maxZoom: 18});
        // While the camera flies, the tiles already there stretch along and
        // the new ones load once it has arrived, instead of a level at a time.
        L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg', {
            maxZoom: 18, opacity: 0.55, updateWhenZooming: false, keepBuffer: 4,
            attribution: '© <a href="https://www.swisstopo.admin.ch/" rel="external noopener noreferrer">swisstopo</a>'
        }).addTo(map);

        // The whole route, faint, and on it the part already travelled.
        var trails = scenes.map(function (scene) {
            var colour = TONES[scene.tone];
            var walk = scene.tone === 'walk';
            L.polyline(scene.path.points, {
                color: colour, weight: walk ? 4 : 6, opacity: walk ? 0.5 : 0.3,
                dashArray: walk ? '1 8' : null, lineCap: 'round', interactive: false
            }).addTo(map);
            return L.polyline([], {
                color: walk ? TONES['long-distance'] : colour, weight: walk ? 6 : 7, opacity: 0.95,
                dashArray: walk ? '1 10' : null, lineCap: 'round', interactive: false
            }).addTo(map);
        });

        // Stops: every one a dot; the ends and the changes named.
        var labels = [];
        var focused = null;     // the named stop clicked in the list
        (connection.sections || []).forEach(function (section, index, all) {
            var stops = section.journey ? section.journey.passList || [] : [];
            stops.forEach(function (stop) {
                var c = coordinate(stop);
                if (c) {
                    L.circleMarker(c, {radius: 3.5, color: TONES[toneOf(section)], weight: 2, fillColor: '#fff', fillOpacity: 1})
                        .bindTooltip(stationName(stop) + ' ' + clock(stop.departure || stop.arrival)).addTo(map);
                }
            });
            [[section.departure, index === 0 ? 0 : 2], [section.arrival, index === all.length - 1 ? 1 : 2]].forEach(function (pair) {
                var c = pair[0] && coordinate(pair[0]);
                if (!c) return;
                var name = stationName(pair[0]);
                // Where one part ends and the next begins: one dot, one name.
                var same = labels.filter(function (l) { return l.name === name && metres(l.at, c) < 60; })[0];
                if (same) { same.rank = Math.min(same.rank, pair[1]); return; }
                var layer = L.circleMarker(c, {radius: 5, color: TONES.walk, weight: 2.5, fillColor: '#fff', fillOpacity: 1})
                    .bindTooltip(name, {permanent: true, direction: 'right', offset: [6, 0], className: 'stop-label'})
                    .addTo(map);
                labels.push({name: name, at: c, rank: pair[1], layer: layer});
            });
        });

        // Names that would overlap another are left out, the start and the
        // end first, then the changes; again after every move of the map.
        function declutter() {
            var taken = [];
            function free(node) {
                if (!node) return false;
                node.style.visibility = '';
                var box = node.getBoundingClientRect();
                var clash = taken.some(function (t) {
                    return box.left < t.right && box.right > t.left && box.top < t.bottom && box.bottom > t.top;
                });
                if (clash) node.style.visibility = 'hidden';
                else taken.push(box);
                return !clash;
            }
            // The play button over the map is in the way too.
            if (!bigPlay.hidden) taken.push(bigPlay.getBoundingClientRect());
            if (spot && spot.getTooltip()) free(spot.getTooltip().getElement());
            labels.slice().sort(function (a, b) { return (b === focused) - (a === focused) || a.rank - b.rank; })
                .forEach(function (l) { free(l.layer.getTooltip().getElement()); });
        }
        map.on('zoomend moveend', declutter);

        var rider = L.marker(scenes[0].path.points[0], {keyboard: false, interactive: false, zIndexOffset: 1000}).addTo(map);
        var all = L.latLngBounds([]);
        scenes.forEach(function (scene) { all.extend(scene.path.points); });
        map.fitBounds(all, {padding: [30, 30]});
        declutter();

        var state = {s: 0, playing: false, speed: 1, follow: true, live: false, scene: -1, flying: false, last: null, west: false};

        function iconFor(scene, done) {
            var kind = done ? 'pin' : scene.kind === 'wait' ? 'walk' : scene.kind;
            var tag = '';
            if (done) {
                tag = 'Arrived';
            } else if (scene.type === 'section' && scene.data.journey) {
                var dep = scene.data.departure;
                tag = vehicle(scene.data.journey) + (dep.delay > 0 ? ' <span class="late">+' + dep.delay + '</span>' : '');
            } else if (scene.type !== 'section') {
                tag = (scene.type === 'change' ? 'Change · ' : 'Wait · ') + Math.max(1, Math.round((scene.t1 - scene.t0) / 60000)) + '′';
            }
            var classes = 'rider ' + (scene.tone === 'walk' && !done ? 'walk' : '') + (done ? ' arrived' : '') + (REDUCED_MOTION ? '' : ' pop');
            var svg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[kind] || ICONS.train) + '</svg>';
            return L.divIcon({
                className: 'rider-icon', iconSize: [36, 36], iconAnchor: [18, 18],
                html: '<div class="' + classes + '" style="--tone:' + TONES[done ? 'long-distance' : scene.tone] + '">' +
                    '<div class="disc">' + svg + '</div>' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</div>'
            });
        }

        function describe(scene, t, done) {
            doing.textContent = '';
            if (done) {
                var to = connection.to;
                doing.append('Arrived at ', el('strong', {text: stationName(to)}), el('span', {class: 'muted', text: ' · ' + duration(connection.duration)}));
                return;
            }
            if (scene.type !== 'section') {
                var next = (connection.sections || [])[scene.section];
                var what = scene.type === 'change' ? (scene.kind === 'walk' ? 'Change, walk over' : 'Change') : 'Wait';
                doing.append(what, el('span', {class: 'muted', text: ' · ' + Math.max(1, Math.round((scene.t1 - t) / 60000)) + ' min until ' + (next && next.journey ? vehicle(next.journey) : 'the next part')}));
                return;
            }
            var section = scene.data;
            if (!section.journey) {
                var levels = section.geometry && section.geometry.levels;
                var floor = levels && levels[0] < 0 ? ', down to level ' + levels[0] : levels && levels[1] > 0 ? ', up to level ' + levels[1] : '';
                doing.append(section.rental ? rentalText(section.rental) : 'Walk', ' to ', el('strong', {text: stationName(section.arrival)}),
                    el('span', {class: 'muted', text: ' · ca. ' + walkMinutes(section) + ' min' + floor}));
                return;
            }
            // The next stop the ride reaches after this moment.
            var upcoming = (section.journey.passList || []).filter(function (s, k) {
                var at = k === 0 ? null : expected(s, 'arrival');
                return at != null && at >= t;
            })[0];
            doing.append(el('strong', {text: vehicle(section.journey)}), ' towards ' + (section.journey.to || ''),
                upcoming ? el('span', {class: 'muted', text: ' · next: ' + stationName(upcoming) + ' ' + clock((upcoming.prognosis && upcoming.prognosis.arrival) || upcoming.arrival)}) : null);
        }

        function sceneAtScreen(s) {
            for (var i = 0; i < scenes.length; i++) if (s < scenes[i].s1) return i;
            return scenes.length - 1;
        }
        function sceneAtTime(t) {
            for (var i = 0; i < scenes.length; i++) if (t < scenes[i].t1) return i;
            return scenes.length - 1;
        }
        function timeAt(i, s) {
            var scene = scenes[i], f = (s - scene.s0) / (scene.s1 - scene.s0);
            return scene.t0 + Math.min(1, Math.max(0, f)) * (scene.t1 - scene.t0);
        }
        function screenAt(i, t) {
            var scene = scenes[i], span = scene.t1 - scene.t0;
            var f = span > 0 ? (t - scene.t0) / span : 1;
            return scene.s0 + Math.min(1, Math.max(0, f)) * (scene.s1 - scene.s0);
        }

        function highlight(index) {
            Array.prototype.forEach.call(list.querySelectorAll('li[data-section]'), function (li) {
                li.classList.toggle('now', parseInt(li.getAttribute('data-section'), 10) === index);
            });
        }

        // A flight over many zoom levels would blow the lines and dots up
        // (they are scaled along until it ends): they fade out for it and
        // back in once the map has arrived.
        function fly(target, options) {
            state.flying = true;
            mapNode.classList.add('flying');
            var how = Object.assign({animate: !REDUCED_MOTION, duration: 1.2, easeLinearity: 0.35}, options);
            if (target.lat != null) map.flyTo(target, how.zoom, how);
            else map.flyToBounds(target, how);
        }
        function camera(scene) {
            if (!state.follow || !state.started) return;
            var walk = scene.tone === 'walk';
            fly(L.latLngBounds(scene.path.points).pad(walk ? 0.3 : 0.1), {padding: [40, 40], maxZoom: walk ? 18 : 14});
        }
        map.on('moveend', function () {
            state.flying = false;
            mapNode.classList.remove('flying');
        });
        map.on('dragstart', function () { setFollow(false); });

        function render(i, t, s) {
            var scene = scenes[i];
            var done = s >= total;
            var d = distanceAt(scene, t);
            var spot = along(scene.path, d);
            if (i !== state.scene || done !== state.done) {
                // A new part: every trail redrawn, a fresh icon, the camera along.
                trails.forEach(function (trail, k) { trail.setLatLngs(k < i ? scenes[k].path.points : []); });
                rider.setIcon(iconFor(scene, done));
                highlight(done ? -1 : scene.type === 'section' ? scene.section : -1);
                if (i !== state.scene && !done) camera(scene);
                state.scene = i;
                state.done = done;
                state.last = null;
            }
            trails[i].setLatLngs(scene.path.points.slice(0, spot.index + 1).concat([spot.at]));
            rider.setLatLng(spot.at);

            var node = rider.getElement() && rider.getElement().firstChild;
            if (node) {
                var moved = state.last && metres(state.last, spot.at) > 0.01;
                if (moved) {
                    var west = spot.at[1] < state.last[1];
                    if (Math.abs(spot.at[1] - state.last[1]) > 1e-7) state.west = west;
                }
                node.classList.toggle('west', state.west);
                node.classList.toggle('moving', !!moved && state.playing && !done);
                node.classList.toggle('idle', !moved && !done);
            }
            state.last = spot.at;

            if (state.follow && state.started && !state.flying && !done && !map.getBounds().pad(-0.2).contains(spot.at)) {
                map.panTo(spot.at, {animate: !REDUCED_MOTION, duration: 0.5});
            }
            clockNode.textContent = hhmm(new Date(t));
            slider.value = String(Math.round(s / total * 1000));
            slider.setAttribute('aria-valuetext', hhmm(new Date(t)));
            describe(scene, t, done);
        }

        function show(s) {
            state.s = Math.min(total, Math.max(0, s));
            var i = sceneAtScreen(state.s);
            render(i, timeAt(i, state.s), state.s);
        }

        var frameAt = null;
        function frame(now) {
            if (!state.playing) { frameAt = null; return; }
            if (state.live) {
                var t = Date.now();
                var i = sceneAtTime(t);
                state.s = t >= end ? total : screenAt(i, t);
                render(i, Math.min(Math.max(t, start), end), state.s);
                if (t >= end) setPlaying(false);
            } else {
                var dt = frameAt == null ? 0 : (now - frameAt) / 1000;
                show(state.s + Math.min(dt, 0.1) * state.speed);
                if (state.s >= total) setPlaying(false);
            }
            frameAt = now;
            if (state.playing) requestAnimationFrame(frame);
        }

        function setPlaying(on) {
            if (on && state.s >= total && !state.live) show(0);
            if (on) start_();
            state.playing = on;
            playButton.textContent = '';
            playButton.appendChild(glyph(on ? PAUSE : state.s >= total ? REPLAY : PLAY));
            playButton.setAttribute('aria-label', on ? 'Pause' : 'Play');
            if (on) requestAnimationFrame(frame);
            else show(state.s);
        }
        // The first play: the button over the map goes, the camera starts to follow.
        function start_() {
            bigPlay.hidden = true;
            declutter();
            if (state.started) return;
            state.started = true;
            // The show begins: the camera follows, whatever was looked at before.
            if (spot) { map.removeLayer(spot); spot = null; focused = null; }
            state.follow = true;
            followChip.setAttribute('aria-pressed', 'true');
            if (state.scene >= 0) camera(scenes[state.scene]);
        }
        bigPlay.addEventListener('click', function () { setPlaying(true); });

        function setFollow(on) {
            state.follow = on;
            followChip.setAttribute('aria-pressed', on ? 'true' : 'false');
            if (on && state.scene >= 0) camera(scenes[state.scene]);
        }
        function setLive(on) {
            state.live = on;
            liveChip.setAttribute('aria-pressed', on ? 'true' : 'false');
            if (on) { setFollow(true); setPlaying(true); }
        }

        playButton.addEventListener('click', function () {
            if (state.live && state.playing) setLive(false);
            setPlaying(!state.playing);
        });
        slider.addEventListener('input', function () {
            setLive(false);
            start_();
            show(slider.value / 1000 * total);
        });

        // A stop in the list shows it on the map; a ride or walk, its stretch.
        var spot = null;
        function point(latlon, name) {
            if (spot) map.removeLayer(spot);
            spot = L.marker(latlon, {
                interactive: false, keyboard: false, zIndexOffset: 500,
                icon: L.divIcon({className: 'spot-icon', iconSize: [18, 18], iconAnchor: [9, 9], html: '<span></span>'})
            }).addTo(map);
            // A stop already named on the map keeps its name; others get one.
            focused = labels.filter(function (l) { return l.name === name && metres(l.at, latlon) < 60; })[0] || null;
            if (!focused) spot.bindTooltip(name, {permanent: true, direction: 'top', offset: [0, -10], className: 'stop-label'}).openTooltip();
            declutter();
        }
        list.addEventListener('click', function (event) {
            if (event.target.closest('button, a')) return;
            var row = event.target.closest('li');
            if (!row || !list.contains(row)) return;
            setFollow(false);
            // Out of the way of what is shown, but still there.
            bigPlay.classList.add('docked');
            declutter();
            var where = row.getAttribute('data-at');
            if (where) {
                var latlon = where.split(',').map(Number);
                var name = row.querySelector('.name') || row.lastChild;
                point(latlon, name ? name.textContent : '');
                fly(L.latLng(latlon), {zoom: 17});
                return;
            }
            var section = row.getAttribute('data-section');
            var scene = section != null && scenes.filter(function (sc) { return sc.type === 'section' && String(sc.section) === section; })[0];
            if (scene) {
                if (spot) { map.removeLayer(spot); spot = null; focused = null; }
                fly(L.latLngBounds(scene.path.points).pad(0.1), {padding: [30, 30], maxZoom: scene.tone === 'walk' ? 18 : 15});
            }
        });
        speeds.forEach(function (chip) {
            chip.addEventListener('click', function () {
                state.speed = parseInt(chip.getAttribute('data-speed'), 10);
                speeds.forEach(function (c) { c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'); });
            });
        });
        followChip.addEventListener('click', function () { setFollow(!state.follow); });
        liveChip.addEventListener('click', function () { setLive(!state.live); });

        // "Now" only while the journey is under way.
        var running = Date.now() >= start && Date.now() < end;
        liveChip.hidden = !running;
        show(0);
    }

    // "API request" opens the panel with the request behind what is shown.
    document.getElementById('api-link').addEventListener('click', function () {
        var panel = document.getElementById('api-panel');
        panel.hidden = !panel.hidden;
        this.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    });
    function setApi(url) {
        document.getElementById('api-url').href = url;
        document.getElementById('api-code').textContent = url;
        document.getElementById('api-link').hidden = false;
    }

    function api() { return 'v1'; }

    function ask(query) {
        var params = new URLSearchParams();
        Object.keys(query).forEach(function (k) { if (query[k] !== '' && query[k] != null) params.set(k, query[k]); });
        // Each section with the line it follows, for the map.
        params.set('geometry', '1');
        // The request behind what is shown, linked next to the source code.
        setApi(location.origin + '/' + api() + '/connections?' + params);
        return fetch('../' + api() + '/connections?' + params).then(function (response) {
            if (!response.ok) throw new Error('Error from API: ' + response.status + ' ' + response.statusText);
            return response.json();
        });
    }

    function busy(on) {
        document.getElementById('loading').hidden = !on;
        form.querySelector('[type=submit]').disabled = on;
    }

    function fail(error) {
        var box = document.getElementById('error');
        box.textContent = error.message;
        box.hidden = false;
    }

    function search() {
        document.getElementById('error').hidden = true;
        asked = {
            from: field('from').value.trim(),
            to: field('to').value.trim(),
            via: field('via').value.trim(),
            date: field('date').value,
            time: field('time').value,
            isArrivalTime: arrival ? 1 : 0,
            sharedMobility: field('sharing').checked ? 1 : '',
            limit: 5
        };
        remember();
        shown = [];
        draw();
        busy(true);
        ask(asked).then(function (response) {
            if (response.from) field('from').value = response.from.name;
            if (response.to) field('to').value = response.to.name;
            document.title = field('from').value + ' – ' + field('to').value;
            shown = response.connections || [];
            var summary = document.getElementById('summary');
            summary.textContent = '';
            if (response.from && response.to) {
                summary.append('From ', el('strong', {text: response.from.name}), ' to ', el('strong', {text: response.to.name}));
            }
            summary.hidden = false;
            if (!shown.length) summary.append(' – no connections found.');
            draw();
            // ?open=2 opens the second connection, for a link to one of them.
            var target = openOnLoad && results.querySelectorAll('.connection > button')[openOnLoad - 1];
            openOnLoad = 0;
            if (target) target.click();
            // &map=1 also plays it on the map.
            var play = target && mapOnLoad && target.parentNode.querySelector('.play-map');
            mapOnLoad = false;
            if (play) play.click();
        }).catch(fail).then(function () { busy(false); });
    }

    // Earlier: the ones arriving before the first shown; later: the ones
    // leaving after the last. That works the same on v1 and v2, whose page
    // numbers do not.
    function more(earlier) {
        if (!shown.length) return;
        var edge = earlier ? parse(shown[0].to.arrival) : parse(shown[shown.length - 1].from.departure);
        edge = new Date(edge.getTime() + (earlier ? -60000 : 60000));
        busy(true);
        ask(Object.assign({}, asked, {date: isoDate(edge), time: hhmm(edge), isArrivalTime: earlier ? 1 : 0}))
            .then(function (response) {
                var seen = {};
                shown.forEach(function (c) { seen[key(c)] = true; });
                var fresh = (response.connections || []).filter(function (c) { return !seen[key(c)]; });
                shown = earlier ? fresh.concat(shown) : shown.concat(fresh);
                draw();
            }).catch(fail).then(function () { busy(false); });
    }

    // The question lives in the address, so a search can be bookmarked or sent.
    function remember() {
        var params = new URLSearchParams();
        ['from', 'to', 'via', 'date', 'time'].forEach(function (k) { if (asked[k]) params.set(k, asked[k]); });
        if (arrival) params.set('arrival', '1');
        if (field('sharing').checked) params.set('sharedMobility', '1');
        history.replaceState({}, '', '?' + params);
    }

    // Suggestions as one types, from /locations.
    var timers = {};
    function suggest(input) {
        clearTimeout(timers[input.name]);
        var term = input.value.trim();
        if (term.length < 2) return;
        timers[input.name] = setTimeout(function () {
            // Stops come first; addresses and places (no id) follow, marked
            // as such - a journey can start or end at either.
            var via = input.name === 'via';
            fetch('../' + api() + '/locations?' + (via ? 'type=station&' : '') + 'query=' + encodeURIComponent(term))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var list = document.getElementById(input.name + '-list');
                    list.textContent = '';
                    (data.stations || []).forEach(function (station) {
                        if (!station.name) return;
                        list.appendChild(el('option', station.id
                            ? {value: station.name}
                            : {value: station.name, label: 'Address / place'}));
                    });
                }).catch(function () {});
        }, 200);
    }

    function setArrival(value) {
        arrival = value;
        form.querySelectorAll('[data-arrival]').forEach(function (b) {
            b.classList.toggle('active', (b.getAttribute('data-arrival') === '1') === value);
        });
    }

    function setNow() {
        var now = new Date();
        field('date').value = isoDate(now);
        field('time').value = hhmm(now);
    }

    ['from', 'to', 'via'].forEach(function (name) {
        field(name).addEventListener('input', function () { suggest(field(name)); });
        field(name).addEventListener('focus', function () { this.select(); });
    });
    form.querySelector('.swap').addEventListener('click', function () {
        var from = field('from').value;
        field('from').value = field('to').value;
        field('to').value = from;
    });
    document.getElementById('add-via').addEventListener('click', function () {
        this.hidden = true;
        field('via').hidden = false;
        field('via').focus();
    });
    document.getElementById('now').addEventListener('click', setNow);
    form.querySelectorAll('[data-arrival]').forEach(function (b) {
        b.addEventListener('click', function () { setArrival(b.getAttribute('data-arrival') === '1'); });
    });
    document.getElementById('earlier').addEventListener('click', function () { more(true); });
    document.getElementById('later').addEventListener('click', function () { more(false); });
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        search();
    });

    // Start from the address: a shared link searches at once.
    var params = new URLSearchParams(location.search);
    ['from', 'to', 'via', 'date', 'time'].forEach(function (k) { if (params.get(k)) field(k).value = params.get(k); });
    // The old form sent one "datetime" field.
    var old = /^(\d{4}-\d\d-\d\d)[T ](\d\d:\d\d)/.exec(params.get('datetime') || '');
    if (old) { field('date').value = old[1]; field('time').value = old[2]; }
    if (!field('date').value) setNow();
    if (field('via').value) { field('via').hidden = false; document.getElementById('add-via').hidden = true; }
    setArrival(params.get('arrival') === '1');
    field('sharing').checked = params.get('sharedMobility') === '1';

    if (field('from').value && field('to').value) {
        search();
    } else if (navigator.geolocation) {
        // No search yet: offer the nearest station as "From".
        navigator.geolocation.getCurrentPosition(function (position) {
            fetch('../' + api() + '/locations?x=' + position.coords.latitude + '&y=' + position.coords.longitude)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (!field('from').value && data.stations && data.stations.length) {
                        field('from').value = data.stations[0].name;
                    }
                }).catch(function () {});
        }, function () {}, {enableHighAccuracy: true, maximumAge: 60000, timeout: 15000});
        field('to').focus();
    }
})();
</script>

</body>
</html>
