<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Transport</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.6/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../media/css/layout.css" />

    <style>
        :root {
            --ink: #383a3d;
            --muted: #767a80;
            --line: #e2e4e7;
            --surface: #f6f7f8;
            --red: #a20d0d;
            --long-distance: #c60018;
            --regional: #2d327d;
            --local: #5a5f66;
            --late: #c60018;
        }

        /* Bootstrap's .form-control sets display, which beats the attribute. */
        [hidden] { display: none !important; }

        .search {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .search .swap {
            width: 34px;
            height: 34px;
            padding: 0;
            font-size: 18px;
            line-height: 1;
        }
        .search .via-row { grid-column: 1 / -1; }
        .when {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 24px;
        }
        .when input[type=date] { width: 11em; }
        .when input[type=time] { width: 7.5em; }
        .when .btn-group .btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
        .when .spacer { flex: 1; }
        .when .api { color: var(--muted); font-size: 12px; }
        .when .api select { display: inline-block; width: auto; height: 28px; padding: 2px 6px; font-size: 12px; }
        .link-button { background: none; border: 0; padding: 0; color: #337ab7; }
        .sharing { font-weight: normal; margin: 0; }

        #summary { color: var(--muted); margin-bottom: 12px; }
        #summary strong { color: var(--ink); font-weight: 600; }

        .day {
            margin: 18px 0 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .connection {
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }
        .connection > button {
            display: block;
            width: 100%;
            padding: 12px 16px 10px;
            background: none;
            border: 0;
            text-align: left;
            color: var(--ink);
        }
        .connection > button:hover { background: var(--surface); }
        .connection.open > button { border-bottom: 1px solid var(--line); }
        .head { display: flex; align-items: center; gap: 6px; font-size: 16px; margin-bottom: 8px; }
        .head .line { font-weight: 700; }
        .head .towards { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .head .changes { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
        .row { display: flex; align-items: center; gap: 10px; }
        .row .t { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .track { flex: 1; display: flex; align-items: center; min-width: 0; }
        .seg { display: flex; align-items: center; min-width: 30px; }
        .seg .bar { flex: 1; height: 2px; background: var(--ink); margin: 0 2px; }
        .seg.walk .bar { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); }
        .ico {
            flex: 0 0 auto;
            width: 26px; height: 26px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: #fff;
        }
        .ico svg { width: 16px; height: 16px; }
        .ico.walk { border-color: var(--muted); color: var(--muted); }
        .ico.flat { border: 0; width: 20px; height: 20px; }
        .chevron { color: var(--muted); transition: transform .15s; margin-left: 4px; }
        .connection.open .chevron { transform: rotate(180deg); }
        @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
        .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }

        .badge-product {
            display: inline-block;
            min-width: 2.4em;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            color: #fff;
            background: var(--local);
            white-space: nowrap;
        }
        .badge-product.long-distance { background: var(--long-distance); }
        .badge-product.regional { background: var(--regional); }

        .late { color: var(--late); font-weight: 600; font-size: .85em; }
        .changed { color: var(--late); }
        .muted { color: var(--muted); }

        .legs { list-style: none; margin: 0; padding: 14px 16px 16px; }
        .legs > li { display: grid; grid-template-columns: 4.2em 22px 1fr auto; column-gap: 10px; }
        .legs .t { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; color: var(--muted); padding-top: 1px; }
        .legs .stop .t { color: var(--ink); }
        .legs .rail { position: relative; display: flex; justify-content: center; }
        .legs .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--regional); }
        .legs .walk .rail::before { width: 0; border-left: 2px dotted var(--muted); }
        .legs .stop .rail::after {
            content: ""; position: relative; z-index: 1; margin-top: 4px;
            width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid var(--regional);
        }
        .legs .stop.first .rail::before { top: 10px; }
        .legs .stop.last .rail::before { bottom: calc(100% - 10px); }
        .legs .stop .name { font-weight: 600; }
        .legs .pl { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
        .legs .ride { padding: 8px 0 12px; color: var(--muted); font-size: 14px; }
        .legs .ride .ico { width: 22px; height: 22px; vertical-align: middle; margin-right: 4px; }
        .legs .ride .ico svg { width: 14px; height: 14px; }
        .legs .ride strong { color: var(--ink); }
        .legs .stops-toggle { display: inline-block; margin-top: 6px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: #337ab7; font-size: 13px; }
        .legs .between { list-style: none; padding: 4px 0 0; margin: 0; font-size: 13px; }
        .legs .between li { display: flex; gap: 10px; }
        .legs .between .bt { width: 3em; font-variant-numeric: tabular-nums; }
        .transfer { margin: 0 0 10px 6.3em; font-size: 12px; color: var(--muted); display: block !important; }
        .transfer .late { font-size: inherit; }

        .more { display: flex; justify-content: space-between; margin: 12px 0; }
        .loading { color: var(--muted); padding: 12px 0; }

        @media (max-width: 639px) {
            .row .t { font-size: 16px; }
            .ico { width: 22px; height: 22px; }
            .ico svg { width: 13px; height: 13px; }
            .seg { min-width: 22px; }
            .when .spacer { display: none; }
        }
            .api-panel { background: var(--surface, #f6f7f8); border: 1px solid var(--line, #e2e4e7); border-radius: 6px; padding: 10px 14px; margin: 8px 0 16px; font-size: 13px; }
        .api-panel code { word-break: break-all; }
    </style>
</head>

<body>

<div class="container">
    <header>
        <h1><a href="../">Transport</a></h1>
        <p>Swiss public transport API</p>
    </header>

    <p class="pull-right">
        <button type="button" class="btn btn-link" id="api-link" aria-expanded="false" aria-controls="api-panel" hidden>
            <span class="glyphicon glyphicon-link"></span>
            API request
        </button>
        <a class="btn btn-link" href="https://gitlab.com/opendata.ch/Transport/-/blob/master/service/transport_api/site/examples/connections.html" target="_blank" rel="noopener">
            <span class="glyphicon glyphicon-new-window"></span>
            Source Code
        </a>
    </p>
    <h3>Connection Search Example</h3>
        <div class="api-panel" id="api-panel" hidden>
            <p>Everything on this page runs in the browser against the public API: <code>/locations</code> for the suggestions, <code>/connections</code> for the results.</p>
            <p><a id="api-url" href="#" rel="noopener" target="_blank"><code id="api-code"></code></a></p>
        </div>
    <br>

    <form id="search" autocomplete="off">
        <div class="search">
            <input class="form-control" name="from" list="from-list" placeholder="From: stop or address" aria-label="From" required />
            <button type="button" class="btn btn-default swap" title="Swap" aria-label="Swap from and to">⇄</button>
            <input class="form-control" name="to" list="to-list" placeholder="To: stop or address" aria-label="To" required />
            <div class="via-row">
                <button type="button" class="link-button" id="add-via">+ Via</button>
                <input class="form-control" name="via" list="via-list" placeholder="Via (optional)" aria-label="Via" hidden />
            </div>
        </div>
        <datalist id="from-list"></datalist>
        <datalist id="to-list"></datalist>
        <datalist id="via-list"></datalist>

        <div class="when">
            <input class="form-control" type="date" name="date" aria-label="Date" />
            <input class="form-control" type="time" name="time" aria-label="Time" />
            <button type="button" class="btn btn-default" id="now">Now</button>
            <div class="btn-group" role="group" aria-label="Departure or arrival">
                <button type="button" class="btn btn-default active" data-arrival="0">Departure</button>
                <button type="button" class="btn btn-default" data-arrival="1">Arrival</button>
            </div>
            <label class="sharing" title="Shared bikes, scooters and cars to and from the stops (sharedmobility.ch)"><input type="checkbox" name="sharing"> bikes &amp; scooters</label>
            <button type="submit" class="btn btn-primary">Search</button>
            <span class="spacer"></span>
            <!-- The source switch stays for testing (?api=v1-old); it is not shown. -->
            <label class="api" hidden>API
                <select class="form-control" name="api">
                    <option value="v1">v1 (opentransportdata.swiss)</option>
                    <option value="v1-old">v1-old (search.ch)</option>
                </select>
            </label>
        </div>
    </form>

    <p id="error" class="text-danger" hidden></p>
    <div id="summary" hidden></div>
    <div class="more" id="earlier-row" hidden><button type="button" class="link-button" id="earlier">↑ Earlier connections</button></div>
    <div id="results"></div>
    <div class="more" id="later-row" hidden><span></span><button type="button" class="link-button" id="later">Later connections ↓</button></div>
    <div class="loading" id="loading" hidden>Searching…</div>

    <footer class="footer">
        <hr>
        <p>Powered by <a href="https://opendata.ch/">Opendata.ch</a> · <a href="/privacy.html">Privacy policy</a> · <a href="/licenses.html">Licenses</a></p>
    </footer>
</div>

<script>
(function () {
    'use strict';

    var form = document.getElementById('search');
    var results = document.getElementById('results');
    var field = function (name) { return form.elements[name]; };
    var arrival = false;
    // What is on screen: the connections, and the question that found them.
    var shown = [];
    // Read before the address is rewritten by the first search.
    var openOnLoad = parseInt(new URLSearchParams(location.search).get('open'), 10) || 0;
    var asked = null;

    // Categories that run between cities, drawn red as on the station
    // displays; S-Bahn and regional trains blue; everything else grey.
    var LONG_DISTANCE = ['IC', 'ICE', 'ICN', 'IR', 'IRE', 'EC', 'EN', 'TGV', 'RJ', 'RJX', 'NJ', 'PE', 'GEX', 'BEX', 'VAE', 'EXT', 'CNL'];
    var REGIONAL = ['S', 'SN', 'R', 'RE', 'RB', 'TER', 'PE'];

    function el(tag, attributes, children) {
        var node = document.createElement(tag);
        Object.keys(attributes || {}).forEach(function (key) {
            if (key === 'text') node.textContent = attributes[key];
            else node.setAttribute(key, attributes[key]);
        });
        (children || []).forEach(function (child) {
            if (child) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
        });
        return node;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

    // The API writes "2026-10-04T21:39:00+0200"; Safari wants "+02:00".
    function parse(value) {
        return value ? new Date(value.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')) : null;
    }
    function clock(value) { var d = parse(value); return d ? hhmm(d) : ''; }

    // "00d01:34:00" -> "1 h 34 min", "00d00:45:00" -> "45 min"
    function duration(value) {
        var m = /^(\d+)d(\d\d):(\d\d)/.exec(value || '');
        if (!m) return '';
        var hours = parseInt(m[1], 10) * 24 + parseInt(m[2], 10);
        return hours ? hours + ' h ' + m[3] + ' min' : parseInt(m[3], 10) + ' min';
    }

    function minutesBetween(a, b) {
        return Math.round((parse(b) - parse(a)) / 60000);
    }

    // The walk's own duration when the API gives one, else its timetable span.
    function walkMinutes(section) {
        if (section.walk && section.walk.duration) return Math.round(section.walk.duration / 60);
        return minutesBetween(section.departure.departure, section.arrival.arrival);
    }

    // "Lime e-scooter", "PubliBike bike": a shared vehicle in plain words.
    var VEHICLES = {bicycle: 'bike', cargo_bicycle: 'cargo bike', scooter_standing: 'scooter', scooter_seated: 'moped', car: 'car', moped: 'moped'};
    function rentalText(rental) {
        var kind = VEHICLES[rental.vehicle] || 'vehicle';
        var electric = rental.propulsion && rental.propulsion.indexOf('electric') === 0 && kind !== 'car';
        return (rental.provider ? rental.provider + ' ' : '') + (electric ? 'e-' : '') + kind;
    }

    function delay(minutes) {
        return minutes > 0 ? el('span', {class: 'late', text: ' +' + minutes}) : null;
    }

    function platform(stop) {
        var changed = stop.prognosis && stop.prognosis.platform;
        var value = changed || stop.platform;
        if (!value) return null;
        return el('span', {class: changed ? 'changed' : '', title: changed ? 'Platform changed' : ''}, ['Pl. ' + value]);
    }

    function badge(text, category) {
        var head = (category || String(text).split(/[\s\d]/)[0]).toUpperCase();
        var kind = LONG_DISTANCE.indexOf(head) >= 0 ? ' long-distance' : REGIONAL.indexOf(head) >= 0 ? ' regional' : '';
        return el('span', {class: 'badge-product' + kind, text: text});
    }

    // A section's vehicle as people say it: "IC 5", "S11", "Bus 10".
    function vehicle(journey) {
        var category = journey.category || '';
        var number = journey.number || '';
        if (/^0*\d{4,}$/.test(number)) return category;    // a train number, not a line
        if (category === 'B' || category === 'BUS') return 'Bus ' + number;
        if (category === 'T') return 'Tram ' + number;
        return LONG_DISTANCE.indexOf(category) >= 0 && number ? category + ' ' + number : category + number;
    }

    function stationName(stop) {
        // A shared vehicle is picked up or left where it stands, which has no name.
        return (stop.station && stop.station.name) || (stop.location && stop.location.name) || 'On the street';
    }

    // Icons from Tabler Icons (https://tabler.io/icons, MIT License,
    // Copyright (c) 2020-2025 Pawel Kuna) and, for the tram, Lucide
    // (https://lucide.dev, ISC License, Copyright (c) Lucide Contributors,
    // portions Copyright (c) 2013-2023 Cole Bemis as part of Feather, MIT).
    // Both licences allow use and change with this notice kept. The e-bike
    // is Tabler's bike with Tabler's bolt.
    var ICONS = {
        "walk": "<path d=\"M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\" /> <path d=\"M7 21l3 -4\" /> <path d=\"M16 21l-2 -4l-3 -3l1 -6\" /> <path d=\"M6 12l2 -3l4 -1l3 3l3 1\" />",
        "bus": "<path d=\"M6 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M18 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M4 17h-2v-11a1 1 0 0 1 1 -1h14a5 7 0 0 1 5 7v5h-2m-4 0h-8\" /> <path d=\"M16 5l1.5 7l4.5 0\" /> <path d=\"M2 10l15 0\" /> <path d=\"M7 5l0 5\" /> <path d=\"M12 5l0 5\" />",
        "train": "<path d=\"M21 13c0 -3.87 -3.37 -7 -10 -7h-8\" /> <path d=\"M3 15h16a2 2 0 0 0 2 -2\" /> <path d=\"M3 6v5h17.5\" /> <path d=\"M3 11v4\" /> <path d=\"M8 11v-5\" /> <path d=\"M13 11v-4.5\" /> <path d=\"M3 19h18\" />",
        "tram": "<rect width=\"16\" height=\"16\" x=\"4\" y=\"3\" rx=\"2\" /> <path d=\"M4 11h16\" /> <path d=\"M12 3v8\" /> <path d=\"m8 19-2 3\" /> <path d=\"m18 22-2-3\" /> <path d=\"M8 15h.01\" /> <path d=\"M16 15h.01\" />",
        "ship": "<path d=\"M2 20a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1\" /> <path d=\"M4 18l-1 -5h18l-2 4\" /> <path d=\"M5 13v-6h8l4 6\" /> <path d=\"M7 7v-4h-1\" />",
        "cableway": "<path d=\"M4 5l16 -2m-8 1v10m-5.106 -6h10.306c2.45 3 2.45 9 -.2 12h-10.106c-2.544 -3 -2.544 -9 0 -12zm-1.894 6h14\" />",
        "bike": "<path d=\"M5 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0\" /> <path d=\"M19 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0\" /> <path d=\"M12 19l0 -4l-3 -3l5 -4l2 3l3 0\" /> <path d=\"M17 5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\" />",
        "scooter": "<path d=\"M18 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M6 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M8 17h5a6 6 0 0 1 5 -5v-5a2 2 0 0 0 -2 -2h-1\" />",
        "escooter": "<path d=\"M18 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M6 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M8 17h5a6 6 0 0 1 5 -5v-5a2 2 0 0 0 -2 -2h-1\" /> <path d=\"M10 4l-2 4h3l-2 4\" />",
        "moped": "<path d=\"M18 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M5 16v1a2 2 0 0 0 4 0v-5h-3a3 3 0 0 0 -3 3v1h10a6 6 0 0 1 5 -4v-5a2 2 0 0 0 -2 -2h-1\" /> <path d=\"M6 9l3 0\" />",
        "car": "<path d=\"M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5\" />",
        "pin": "<path d=\"M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0\" /> <path d=\"M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z\" />",
        "ebike": "<path d=\"M5 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0\" /> <path d=\"M19 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0\" /> <path d=\"M12 19l0 -4l-3 -3l5 -4l2 3l3 0\" /> <path d=\"M17 5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\" /><g transform=\"translate(13 0) scale(.45)\"><path d=\"M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11\" /></g>"
    };

    var ICON_TITLES = {walk: 'walk', cableway: 'cable car', ebike: 'e-bike', escooter: 'e-scooter', pin: 'destination'};
    var SVG = 'http://www.w3.org/2000/svg';
    function icon(kind, extra) {
        var svg = document.createElementNS(SVG, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        svg.innerHTML = ICONS[kind] || ICONS.train;
        return el('span', {class: 'ico ' + kind + (extra ? ' ' + extra : ''), title: ICON_TITLES[kind] || kind}, [svg]);
    }

    // The kind of vehicle, from the category the timetable gives a line.
    var BUSES = ['B', 'BUS', 'NFB', 'EXB', 'BP', 'EV', 'KB', 'RUB', 'TX', 'NB'];
    var TRAMS = ['T', 'NFT', 'TRAM', 'M', 'MET'];
    var SHIPS = ['BAT', 'FAE', 'SCH', 'KAT', 'BAV'];
    var LIFTS = ['FUN', 'PB', 'GB', 'LB', 'SL', 'SB', 'CC', 'ASC', 'GLB'];
    function kindOf(section) {
        if (section.rental) {
            var v = section.rental.vehicle || '';
            var electric = (section.rental.propulsion || '').indexOf('electric') === 0;
            if (v === 'car') return 'car';
            if (v === 'moped' || v === 'scooter_seated') return 'moped';
            if (v.indexOf('scooter') === 0) return electric ? 'escooter' : 'scooter';
            return electric ? 'ebike' : 'bike';
        }
        if (!section.journey) return 'walk';
        var c = (section.journey.category || '').toUpperCase();
        if (BUSES.indexOf(c) >= 0) return 'bus';
        if (TRAMS.indexOf(c) >= 0) return 'tram';
        if (SHIPS.indexOf(c) >= 0) return 'ship';
        if (LIFTS.indexOf(c) >= 0) return 'cableway';
        return 'train';
    }

    function sectionMinutes(section) {
        if (!section.journey) return walkMinutes(section);
        return minutesBetween(section.departure.departure, section.arrival.arrival);
    }

    function legs(connection) {
        var list = el('ol', {class: 'legs'});
        var sections = connection.sections || [];
        sections.forEach(function (section, index) {
            var dep = section.departure, arr = section.arrival, journey = section.journey;
            var kind = kindOf(section);
            var walk = !journey;
            list.appendChild(el('li', {class: 'stop' + (index === 0 ? ' first' : '') + (walk ? ' walk' : '')}, [
                el('span', {class: 't'}, [clock(dep.departure), delay(dep.delay)]),
                el('span', {class: 'rail'}),
                el('span', {class: 'name', text: stationName(dep)}),
                el('span', {class: 'pl'}, [platform(dep)])
            ]));
            var ride;
            if (walk) {
                ride = [icon(kind), section.rental ? rentalText(section.rental) : 'Walk', ' ca. ' + walkMinutes(section) + ' min'];
            } else {
                var between = (journey.passList || []).slice(1, -1).filter(function (s) { return s.departure || s.arrival; });
                ride = [
                    icon(kind), el('strong', {text: vehicle(journey)}), ' towards ' + (journey.to || ''),
                    journey.operator ? el('span', {text: ' · ' + journey.operator}) : null
                ];
                if (between.length) {
                    var listOf = el('ul', {class: 'between', hidden: ''}, between.map(function (s) {
                        return el('li', {}, [el('span', {class: 'bt', text: clock(s.departure || s.arrival)}), el('span', {text: stationName(s)})]);
                    }));
                    var toggle = el('button', {type: 'button', class: 'stops-toggle', 'aria-expanded': 'false'},
                        [between.length + (between.length === 1 ? ' stop' : ' stops') + ' ›']);
                    toggle.addEventListener('click', function () {
                        listOf.hidden = !listOf.hidden;
                        toggle.setAttribute('aria-expanded', listOf.hidden ? 'false' : 'true');
                    });
                    ride.push(el('br'), toggle, listOf);
                }
            }
            list.appendChild(el('li', {class: walk ? 'walk' : ''}, [
                el('span', {}), el('span', {class: 'rail'}), el('div', {class: 'ride'}, ride), el('span', {})
            ]));

            var next = sections[index + 1];
            if (next && journey && next.journey) {
                var planned = minutesBetween(arr.arrival, next.departure.departure);
                var expected = minutesBetween(
                    (arr.prognosis && arr.prognosis.arrival) || arr.arrival,
                    (next.departure.prognosis && next.departure.prognosis.departure) || next.departure.departure
                );
                list.appendChild(el('li', {class: 'stop last' + (walk ? ' walk' : '')}, [
                    el('span', {class: 't'}, [clock(arr.arrival), delay(arr.delay)]),
                    el('span', {class: 'rail'}),
                    el('span', {class: 'name', text: stationName(arr)}),
                    el('span', {class: 'pl'}, [platform(arr)])
                ]));
                list.appendChild(el('li', {class: 'transfer'}, [
                    'Change · ' + planned + ' min',
                    expected !== planned ? el('span', {class: 'late', text: ' (' + expected + ' min with delays)'}) : null
                ]));
            } else if (!next) {
                list.appendChild(el('li', {class: 'stop last' + (walk ? ' walk' : '')}, [
                    el('span', {class: 't'}, [clock(arr.arrival), delay(arr.delay)]),
                    el('span', {class: 'rail'}),
                    el('span', {class: 'name', text: stationName(arr)}),
                    el('span', {class: 'pl'}, [platform(arr)])
                ]));
            }
        });
        return list;
    }

    function card(connection, index) {
        var from = connection.from, to = connection.to;
        var sections = connection.sections || [];
        var firstRide = sections.filter(function (s) { return s.journey; })[0];
        var head = firstRide
            ? [icon(kindOf(firstRide), 'flat'), el('span', {class: 'line', text: vehicle(firstRide.journey)}),
               el('span', {class: 'towards', text: 'towards ' + (firstRide.journey.to || '')})]
            : [icon('walk', 'flat'), el('span', {class: 'line', text: 'Walk'})];
        head.push(el('span', {class: 'changes', text: connection.transfers === 0 ? 'direct' : connection.transfers + (connection.transfers === 1 ? ' change' : ' changes')}));

        var total = sections.reduce(function (sum, s) { return sum + Math.max(1, sectionMinutes(s)); }, 0) || 1;
        var track = el('span', {class: 'track'}, sections.map(function (s) {
            var kind = kindOf(s);
            var seg = el('span', {class: 'seg' + (s.journey ? '' : ' walk')}, [icon(kind), el('span', {class: 'bar'})]);
            seg.style.flex = String(Math.max(1, sectionMinutes(s)) / total * 100);
            return seg;
        }).concat([icon('pin')]));

        var start = sections[0] && !sections[0].journey
            ? walkMinutes(sections[0]) + "' " + (sections[0].rental ? rentalText(sections[0].rental) : 'walk')
            : (platform(from) ? 'Platform ' + (from.prognosis && from.prognosis.platform || from.platform) : '');
        var details = el('div', {hidden: ''});
        var button = el('button', {type: 'button', 'aria-expanded': 'false'}, [
            el('div', {class: 'head'}, head),
            el('div', {class: 'row'}, [
                el('span', {class: 't'}, [clock(from.departure), delay(from.delay)]),
                track,
                el('span', {class: 't'}, [clock(to.arrival), delay(to.delay)]),
                el('span', {class: 'chevron glyphicon glyphicon-chevron-down', 'aria-hidden': 'true'})
            ]),
            el('div', {class: 'foot'}, [el('span', {text: start}), el('span', {text: duration(connection.duration)})])
        ]);
        var box = el('div', {class: 'connection', 'data-index': index}, [button, details]);
        button.addEventListener('click', function () {
            var open = box.classList.toggle('open');
            button.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open && !details.firstChild) details.appendChild(legs(connection));
            details.hidden = !open;
        });
        return box;
    }

    function key(connection) {
        return connection.from.departure + '|' + connection.to.arrival + '|' + (connection.products || []).join(',');
    }

    function draw() {
        results.textContent = '';
        var day = null;
        shown.forEach(function (connection, index) {
            var d = parse(connection.from.departure);
            var label = d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
            if (label !== day) {
                results.appendChild(el('div', {class: 'day', text: label}));
                day = label;
            }
            results.appendChild(card(connection, index));
        });
        var any = shown.length > 0;
        document.getElementById('earlier-row').hidden = !any;
        document.getElementById('later-row').hidden = !any;
    }

    // "API request" opens the panel with the request behind what is shown.
    document.getElementById('api-link').addEventListener('click', function () {
        var panel = document.getElementById('api-panel');
        panel.hidden = !panel.hidden;
        this.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    });
    function setApi(url) {
        document.getElementById('api-url').href = url;
        document.getElementById('api-code').textContent = url;
        document.getElementById('api-link').hidden = false;
    }

    function api() { return field('api').value === 'v1-old' ? 'v1-old' : 'v1'; }

    function ask(query) {
        var params = new URLSearchParams();
        Object.keys(query).forEach(function (k) { if (query[k] !== '' && query[k] != null) params.set(k, query[k]); });
        // The request behind what is shown, linked next to the source code.
        setApi(location.origin + '/' + api() + '/connections?' + params);
        return fetch('../' + api() + '/connections?' + params).then(function (response) {
            if (!response.ok) throw new Error('Error from API: ' + response.status + ' ' + response.statusText);
            return response.json();
        });
    }

    function busy(on) {
        document.getElementById('loading').hidden = !on;
        form.querySelector('[type=submit]').disabled = on;
    }

    function fail(error) {
        var box = document.getElementById('error');
        box.textContent = error.message;
        box.hidden = false;
    }

    function search() {
        document.getElementById('error').hidden = true;
        asked = {
            from: field('from').value.trim(),
            to: field('to').value.trim(),
            via: field('via').value.trim(),
            date: field('date').value,
            time: field('time').value,
            isArrivalTime: arrival ? 1 : 0,
            sharedMobility: field('sharing').checked ? 1 : '',
            limit: 5
        };
        remember();
        shown = [];
        draw();
        busy(true);
        ask(asked).then(function (response) {
            if (response.from) field('from').value = response.from.name;
            if (response.to) field('to').value = response.to.name;
            document.title = field('from').value + ' – ' + field('to').value;
            shown = response.connections || [];
            var summary = document.getElementById('summary');
            summary.textContent = '';
            if (response.from && response.to) {
                summary.append('From ', el('strong', {text: response.from.name}), ' to ', el('strong', {text: response.to.name}));
            }
            summary.hidden = false;
            if (!shown.length) summary.append(' – no connections found.');
            draw();
            // ?open=2 opens the second connection, for a link to one of them.
            var target = openOnLoad && results.querySelectorAll('.connection > button')[openOnLoad - 1];
            openOnLoad = 0;
            if (target) target.click();
        }).catch(fail).then(function () { busy(false); });
    }

    // Earlier: the ones arriving before the first shown; later: the ones
    // leaving after the last. That works the same on v1 and v2, whose page
    // numbers do not.
    function more(earlier) {
        if (!shown.length) return;
        var edge = earlier ? parse(shown[0].to.arrival) : parse(shown[shown.length - 1].from.departure);
        edge = new Date(edge.getTime() + (earlier ? -60000 : 60000));
        busy(true);
        ask(Object.assign({}, asked, {date: isoDate(edge), time: hhmm(edge), isArrivalTime: earlier ? 1 : 0}))
            .then(function (response) {
                var seen = {};
                shown.forEach(function (c) { seen[key(c)] = true; });
                var fresh = (response.connections || []).filter(function (c) { return !seen[key(c)]; });
                shown = earlier ? fresh.concat(shown) : shown.concat(fresh);
                draw();
            }).catch(fail).then(function () { busy(false); });
    }

    // The question lives in the address, so a search can be bookmarked or sent.
    function remember() {
        var params = new URLSearchParams();
        ['from', 'to', 'via', 'date', 'time'].forEach(function (k) { if (asked[k]) params.set(k, asked[k]); });
        if (arrival) params.set('arrival', '1');
        if (field('sharing').checked) params.set('sharedMobility', '1');
        if (api() === 'v1-old') params.set('api', 'v1-old');
        history.replaceState({}, '', '?' + params);
    }

    // Suggestions as one types, from /locations.
    var timers = {};
    function suggest(input) {
        clearTimeout(timers[input.name]);
        var term = input.value.trim();
        if (term.length < 2) return;
        timers[input.name] = setTimeout(function () {
            // Stops come first; addresses and places (no id) follow, marked
            // as such - a journey can start or end at either.
            var via = input.name === 'via';
            fetch('../' + api() + '/locations?' + (via ? 'type=station&' : '') + 'query=' + encodeURIComponent(term))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var list = document.getElementById(input.name + '-list');
                    list.textContent = '';
                    (data.stations || []).forEach(function (station) {
                        if (!station.name) return;
                        list.appendChild(el('option', station.id
                            ? {value: station.name}
                            : {value: station.name, label: 'Address / place'}));
                    });
                }).catch(function () {});
        }, 200);
    }

    function setArrival(value) {
        arrival = value;
        form.querySelectorAll('[data-arrival]').forEach(function (b) {
            b.classList.toggle('active', (b.getAttribute('data-arrival') === '1') === value);
        });
    }

    function setNow() {
        var now = new Date();
        field('date').value = isoDate(now);
        field('time').value = hhmm(now);
    }

    ['from', 'to', 'via'].forEach(function (name) {
        field(name).addEventListener('input', function () { suggest(field(name)); });
        field(name).addEventListener('focus', function () { this.select(); });
    });
    form.querySelector('.swap').addEventListener('click', function () {
        var from = field('from').value;
        field('from').value = field('to').value;
        field('to').value = from;
    });
    document.getElementById('add-via').addEventListener('click', function () {
        this.hidden = true;
        field('via').hidden = false;
        field('via').focus();
    });
    document.getElementById('now').addEventListener('click', setNow);
    form.querySelectorAll('[data-arrival]').forEach(function (b) {
        b.addEventListener('click', function () { setArrival(b.getAttribute('data-arrival') === '1'); });
    });
    document.getElementById('earlier').addEventListener('click', function () { more(true); });
    document.getElementById('later').addEventListener('click', function () { more(false); });
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        search();
    });

    // Start from the address: a shared link searches at once.
    var params = new URLSearchParams(location.search);
    ['from', 'to', 'via', 'date', 'time'].forEach(function (k) { if (params.get(k)) field(k).value = params.get(k); });
    // The old form sent one "datetime" field.
    var old = /^(\d{4}-\d\d-\d\d)[T ](\d\d:\d\d)/.exec(params.get('datetime') || '');
    if (old) { field('date').value = old[1]; field('time').value = old[2]; }
    if (!field('date').value) setNow();
    if (field('via').value) { field('via').hidden = false; document.getElementById('add-via').hidden = true; }
    setArrival(params.get('arrival') === '1');
    field('sharing').checked = params.get('sharedMobility') === '1';
    field('api').value = params.get('api') === 'v1-old' ? 'v1-old' : 'v1';

    if (field('from').value && field('to').value) {
        search();
    } else if (navigator.geolocation) {
        // No search yet: offer the nearest station as "From".
        navigator.geolocation.getCurrentPosition(function (position) {
            fetch('../' + api() + '/locations?x=' + position.coords.latitude + '&y=' + position.coords.longitude)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (!field('from').value && data.stations && data.stations.length) {
                        field('from').value = data.stations[0].name;
                    }
                }).catch(function () {});
        }, function () {}, {enableHighAccuracy: true, maximumAge: 60000, timeout: 15000});
        field('to').focus();
    }
})();
</script>

</body>
</html>
