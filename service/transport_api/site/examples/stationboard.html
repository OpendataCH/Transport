<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <title>Station Board - Transport</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E61414" />
    <meta name="description" content="Departures from any Swiss stop, live from the open Swiss public transport API: line, destination, platform and real-time delays." />
    <!--head-->

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../media/css/layout.css" />

    <style>
        :root {
            --ink: #383a3d;
            --muted: #767a80;
            --line: #e2e4e7;
            --long-distance: #c60018;
            --regional: #2d327d;
            --local: #5a5f66;
            --late: #c60018;
        }
        [hidden] { display: none !important; }

        /* clear: the floated "Source Code" link would otherwise squeeze the flex form */
        .board-form { display: flex; gap: 8px; margin-bottom: 16px; clear: both; }
        .board-form .form-control { flex: 1; min-width: 0; }
        .switch { flex: 0 0 auto; display: flex; }
        @media (max-width: 639px) {
            .board-form { flex-wrap: wrap; }
            /* 16px keeps iOS from zooming into the field on focus */
            .board-form .form-control { flex-basis: 100%; height: 40px; font-size: 16px; }
            .board-form .switch { flex: 1; display: flex; }
            .board-form .switch .btn { flex: 1; }
            .board-form [type=submit] { flex: 1; }
        }
        .switch .btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
        .api { margin-top: 20px; font-size: 13px; }
        .api summary { cursor: pointer; color: var(--muted); }
        .api code { word-break: break-all; }

        #board-title { margin-top: 24px; }
        #board-title small { display: block; margin-top: 4px; }

        table.board { width: 100%; border-collapse: collapse; }
        .board th {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            padding: 6px 8px;
            text-align: left;
        }
        .board td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .board .t { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 16px; }
        .board .op { color: var(--muted); white-space: nowrap; }
        .board .pl { text-align: right; white-space: nowrap; color: var(--muted); }
        .board .pl.changed { color: var(--late); font-weight: 600; }
        .late { color: var(--late); font-weight: 600; font-size: .85em; }
        .cancelled { color: var(--late); text-decoration: line-through; }

        .badge-product {
            display: inline-block;
            min-width: 2.6em;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            color: #fff;
            background: var(--local);
            white-space: nowrap;
        }
        .badge-product.long-distance { background: var(--long-distance); }
        .badge-product.regional { background: var(--regional); }

        .updated { color: var(--muted); font-size: 12px; margin-top: 8px; }

        @media (max-width: 639px) {
            .board .op { display: none; }
        }
            .api-panel { background: var(--surface, #f6f7f8); border: 1px solid var(--line, #e2e4e7); border-radius: 6px; padding: 10px 14px; margin: 8px 0 16px; font-size: 13px; }
        .api-panel code { word-break: break-all; }
    </style>
</head>

<body>

<div class="container">
    <div class="col-sm-10 col-sm-offset-1">

    <header>
        <h1><a href="../"><img class="logo" src="/media/images/logo.svg" alt="" />Transport</a></h1>
        <p>Swiss public transport API</p>
    </header>

    <article>
        <p class="pull-right">
            <button type="button" class="btn btn-link" id="api-link" aria-expanded="false" aria-controls="api-panel" hidden>
                <span class="glyphicon glyphicon-link"></span>
                API request
            </button>
            <a class="btn btn-link" href="https://gitlab.com/opendata.ch/Transport/-/blob/master/service/transport_api/site/examples/stationboard.html" target="_blank" rel="noopener">
                <span class="glyphicon glyphicon-new-window"></span>
                Source Code
            </a>
        </p>
        <h3>Station Board Example</h3>
        <div class="api-panel" id="api-panel" hidden>
            <p>Everything on this page runs in the browser against the public API: <code>/locations</code> for the suggestions, <code>/stationboard</code> for the board.</p>
            <p><a id="api-url" href="#" rel="noopener" target="_blank"><code id="api-code"></code></a></p>
        </div>

        <form class="board-form" id="board-form" autocomplete="off">
            <input class="form-control" id="station" name="station" list="station-list" placeholder="Stop or station" aria-label="Stop or station" required />
            <datalist id="station-list"></datalist>
            <div class="btn-group switch" role="group" aria-label="Departures or arrivals">
                <button type="button" class="btn btn-default active" data-type="departure" aria-pressed="true">Departures</button>
                <button type="button" class="btn btn-default" data-type="arrival" aria-pressed="false">Arrivals</button>
            </div>
            <button type="submit" class="btn btn-primary">Show</button>
        </form>

        <section id="board" aria-live="polite"><!--board--></section>

    </article>

    <footer class="footer">
        <hr>
        <p>Timetable data: <a href="https://opentransportdata.swiss/" rel="external noopener noreferrer">opentransportdata.swiss</a> · Powered by <a href="https://opendata.ch/">Opendata.ch</a> · <a href="/privacy.html">Privacy policy</a> · <a href="/licenses.html">Licenses</a></p>
    </footer>

    </div>
</div>

<script>
(function () {
    'use strict';

    var LONG_DISTANCE = ['IC', 'ICE', 'ICN', 'IR', 'IRE', 'EC', 'EN', 'TGV', 'RJ', 'RJX', 'NJ', 'PE', 'GEX', 'BEX', 'VAE', 'EXT', 'CNL'];
    var REGIONAL = ['S', 'SN', 'R', 'RE', 'RB', 'TER'];

    var input = document.getElementById('station');
    var type = {value: 'departure'};
    var timer = null;

    function el(tag, attributes, children) {
        var node = document.createElement(tag);
        Object.keys(attributes || {}).forEach(function (k) {
            if (k === 'text') node.textContent = attributes[k]; else node.setAttribute(k, attributes[k]);
        });
        (children || []).forEach(function (c) {
            if (c !== null && c !== undefined) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        });
        return node;
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function clock(value) {
        var d = new Date(value.replace(/([+-]\d\d)(\d\d)$/, '$1:$2'));
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // The line as people read it on the platform: "IR 90", "S1", "Bus 11".
    function line(journey) {
        var category = journey.category || '';
        var number = journey.number || '';
        if (!number || number === category) return category;
        if (category === 'B' || category === 'BUS') return 'Bus ' + number;
        if (category === 'T') return 'Tram ' + number;
        return LONG_DISTANCE.indexOf(category) >= 0 ? category + ' ' + number : category + number;
    }
    // "BLS-bls", "SOB-sob", "AVA/rbz": the API gives the long name of the
    // national timetable, as it always has; people know the operator by
    // the part in front.
    function operator(name) {
        return (name || '').split(/[-/]/)[0].trim();
    }

    function badge(journey) {
        var category = (journey.category || '').toUpperCase();
        var kind = LONG_DISTANCE.indexOf(category) >= 0 ? ' long-distance' : REGIONAL.indexOf(category) >= 0 ? ' regional' : '';
        return el('span', {class: 'badge-product' + kind, text: line(journey)});
    }

    function draw(data) {
        var station = data.station || {};
        var rows = (data.stationboard || []).map(function (journey) {
            var stop = journey.stop;
            var at = type.value === 'arrival' ? stop.arrival || stop.departure : stop.departure;
            var changed = stop.prognosis && stop.prognosis.platform;
            return el('tr', {}, [
                el('td', {class: 't'}, [clock(at), stop.delay > 0 ? el('span', {class: 'late', text: ' +' + stop.delay}) : null]),
                el('td', {}, [badge(journey)]),
                el('td', {class: 'op', text: operator(journey.operator)}),
                el('td', {text: journey.to || ''}),
                el('td', {class: 'pl' + (changed ? ' changed' : ''), text: changed || stop.platform || ''})
            ]);
        });
        var section = document.getElementById('board');
        section.textContent = '';
        section.appendChild(el('h2', {id: 'board-title', class: 'h3'}, [
            (type.value === 'arrival' ? 'Arrivals at ' : 'Departures from ') + (station.name || input.value)
        ]));
        if (!rows.length) {
            section.appendChild(el('p', {class: 'text-muted', text: 'No departures found.'}));
            return;
        }
        section.appendChild(el('table', {class: 'board'}, [
            el('thead', {}, [el('tr', {}, [
                el('th', {text: 'Time'}), el('th', {text: 'Line'}), el('th', {class: 'op', text: 'Operator'}), el('th', {text: 'To'}),
                el('th', {class: 'pl', text: 'Platform'})
            ])]),
            el('tbody', {}, rows)
        ]));
        var now = new Date();
        section.appendChild(el('p', {class: 'updated', text: 'Updated ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ', every 30 seconds.'}));
        document.title = (type.value === 'arrival' ? 'Arrivals at ' : 'Departures from ') + (station.name || input.value) + ' - Transport';
    }

    function load(push) {
        var name = input.value.trim();
        if (!name) return;
        var params = new URLSearchParams({station: name, limit: 20});
        if (type.value === 'arrival') params.set('type', 'arrival');
        fetch('../v1/stationboard?' + params).then(function (r) { return r.json(); }).then(function (data) {
            draw(data);
            if (data.station && data.station.name) input.value = data.station.name;
            var address = new URLSearchParams({station: input.value});
            if (type.value === 'arrival') address.set('type', 'arrival');
            history[push ? 'pushState' : 'replaceState']({}, '', '?' + address);
            showApi(params, address);
        }).catch(function () {});
        clearTimeout(timer);
        timer = setTimeout(function () { load(false); }, 30000);
    }


    // "API request" opens the panel with the request behind what is shown.
    document.getElementById('api-link').addEventListener('click', function () {
        var panel = document.getElementById('api-panel');
        panel.hidden = !panel.hidden;
        this.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    });
    function setApi(url) {
        document.getElementById('api-url').href = url;
        document.getElementById('api-code').textContent = url;
        document.getElementById('api-link').hidden = false;
    }

    // The request this board is built from, for whoever wants to build their own.
    function showApi(params, address) {
        setApi(location.origin + '/v1/stationboard?' + params);
    }

    function setType(value) {
        type.value = value;
        document.querySelectorAll('[data-type]').forEach(function (b) {
            var on = b.getAttribute('data-type') === value;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
    }

    // Suggestions as one types: stops only, a board needs one.
    var suggesting = null;
    input.addEventListener('input', function () {
        clearTimeout(suggesting);
        var term = input.value.trim();
        if (term.length < 2) return;
        suggesting = setTimeout(function () {
            fetch('../v1/locations?type=station&query=' + encodeURIComponent(term))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var list = document.getElementById('station-list');
                    list.textContent = '';
                    (data.stations || []).forEach(function (s) {
                        if (s.id && s.name) list.appendChild(el('option', {value: s.name}));
                    });
                }).catch(function () {});
        }, 200);
    });
    input.addEventListener('focus', function () { this.select(); });
    // Picking a suggestion shows its board at once.
    input.addEventListener('change', function () {
        var options = document.getElementById('station-list').options;
        for (var i = 0; i < options.length; i++) {
            if (options[i].value === input.value) { load(true); return; }
        }
    });
    document.getElementById('board-form').addEventListener('submit', function (e) {
        e.preventDefault();
        load(true);
    });
    document.querySelectorAll('[data-type]').forEach(function (b) {
        b.addEventListener('click', function () {
            setType(b.getAttribute('data-type'));
            load(true);
        });
    });

    var params = new URLSearchParams(location.search);
    input.value = params.get('station') || params.get('id') || input.getAttribute('data-default') || 'Bern';
    setType(params.get('type') === 'arrival' ? 'arrival' : 'departure');
    // The server has already drawn the board for a linked station; refresh it
    // in a while, or draw it now when it has not.
    if (document.querySelector('#board table')) {
        var initial = new URLSearchParams({station: input.value, limit: 20});
        var here = new URLSearchParams({station: input.value});
        if (type.value === 'arrival') { initial.set('type', 'arrival'); here.set('type', 'arrival'); }
        showApi(initial, here);
        timer = setTimeout(function () { load(false); }, 30000);
    } else {
        load(false);
    }
})();
</script>

</body>
</html>
