[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transport-api"
version = "0.1.0"
description = "The Python service behind /v2 of transport.opendata.ch"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["transport_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
