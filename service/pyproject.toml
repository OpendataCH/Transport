[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transport-api"
version = "0.1.0"
description = "transport.opendata.ch: the API and the website around it"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "redis>=5.2",
    "jinja2>=3.1",
    "asyncpg>=0.30",
    "gtfs-realtime-bindings>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["transport_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
