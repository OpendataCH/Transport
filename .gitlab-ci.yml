# Build the container image here instead of on the servers.
#
# The image is what gets deployed: the servers pull a tag from this project's
# registry rather than building anything themselves.
# That keeps the build off machines whose job is to answer requests, and it
# makes a deployment reproducible - a tag is a fixed thing, a working copy is
# not.
#
# The registry is public because this project is, so a server pulls without
# credentials. Nothing secret is needed on the receiving end.

stages:
  - test
  - build
  - verify

test:service:
  stage: test
  image: python:3.14-slim
  # The /v2 timetable tests need a real Postgres; without one they skip, and
  # the coverage below would fall short for the wrong reason.
  services:
    - name: postgres:18-alpine
      alias: db
  variables:
    POSTGRES_USER: transport
    POSTGRES_PASSWORD: transport
    POSTGRES_DB: transport_test
    TEST_DATABASE_URL: postgresql://transport:transport@db:5432/transport_test
  before_script:
    - pip install --disable-pip-version-check --no-cache-dir -e './service[dev]'
  script:
    - cd service
    - ruff check .
    - ruff format --check .
    # The report and the coverage show up in merge requests and on the
    # pipeline; below 94 % the job fails.
    - >-
      pytest -q
      --junitxml=report.xml
      --cov=transport_api --cov-report=term --cov-report=xml:coverage.xml
      --cov-fail-under=94
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      junit: service/report.xml
      coverage_report:
        coverage_format: cobertura
        path: service/coverage.xml

# Kaniko rather than docker-in-docker: it needs no privileged runner, and this
# project has no reason to ask for one.
.kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  rules:
    # Every branch gets an image under its commit SHA, so that a branch can be
    # tried on staging. Only the default branch moves `latest` (see the
    # script): that tag must never point at something nobody reviewed.
    - if: $CI_COMMIT_BRANCH

# The one image: the API and the website around it.
build:image:service:
  extends: .kaniko
  script:
    # SERVICE_VERSION is baked in so that /v2/health names the build that is
    # answering, without anyone having to read the compose file on the host.
    - |
      LATEST=""
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        LATEST="--destination ${CI_REGISTRY_IMAGE}/service:latest"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/service" \
        --dockerfile "${CI_PROJECT_DIR}/service/Dockerfile" \
        --build-arg "SERVICE_VERSION=${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}/service:${CI_COMMIT_SHORT_SHA}" \
        ${LATEST}

# The image just built, started as a container and asked what matters: that it
# comes up, reports this build and Europe/Zurich, serves the website and the
# statistics page and answers in the /v1 error envelope. No Redis and no
# timetable here, so the statistics page and the question to the timetable
# are checked in their "not configured" form. The servers deploy by SHA tag, so an image that fails here is never
# rolled out by accident - but `latest` has already moved; do not deploy
# `latest`.
smoke:image:
  stage: verify
  image: python:3.14-slim
  rules:
    - if: $CI_COMMIT_BRANCH
  services:
    - name: "${CI_REGISTRY_IMAGE}/service:${CI_COMMIT_SHORT_SHA}"
      alias: transport
  script:
    - python service/tools/smoke.py http://transport:8000 --version "${CI_COMMIT_SHORT_SHA}" --no-redis --no-timetable

# The same checks against the servers, after a deploy there. Buttons, since
# deploying is a step on the server and not part of this pipeline.
.smoke:host:
  stage: verify
  image: python:3.14-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: true
  script:
    - python service/tools/smoke.py "${HOST}" --version "${CI_COMMIT_SHORT_SHA}"

smoke:staging:
  extends: .smoke:host
  variables:
    HOST: https://test-transport.opendata.ch

smoke:production:
  extends: .smoke:host
  variables:
    HOST: https://transport.opendata.ch

