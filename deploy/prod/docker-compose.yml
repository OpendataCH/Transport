# transport.opendata.ch on OPEN-PRD: only the public entry since 11.10.2026.
#
# The API, its timetable database, the loader, the router and the counters
# behind /stats.php run on a second host (deploy/oparl). Here they took the
# portal down twice in one day: first the router's memory, then - with the
# router moved - the database's CPU, at an ordinary 60 requests a second.
#
# What stays here is what the outside world sees: DNS, the shared nginx with
# the transport vhost (plain http without a redirect, the connection cap, the
# access log) and its upstream 172.18.0.1:8086. That port is now published by
# `edge`, an ssh tunnel to the service on the second host. MOTIS_SSH_DEST in
# .env names user@host; the key in ./motis-link may forward the service's port
# there and nothing else. nginx keeps setting X-Forwarded-For, so the service
# still sees and counts the real callers.
#
# Back to the local stack: the previous revision of this file (service, db,
# ingest, motis, redis); their volumes are still on this host.
name: transport

services:
  edge:
    image: alpine:3.22
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    cgroup_parent: transport.slice
    entrypoint:
      - sh
      - -c
      - >-
        apk add -q --no-cache openssh-client &&
        exec ssh -N -i /k/id_ed25519
        -o UserKnownHostsFile=/k/known_hosts -o StrictHostKeyChecking=yes
        -o BatchMode=yes -o ExitOnForwardFailure=yes
        -o ServerAliveInterval=15 -o ServerAliveCountMax=3
        -L 0.0.0.0:8086:127.0.0.1:18086 $${MOTIS_SSH_DEST}
    environment:
      MOTIS_SSH_DEST: ${MOTIS_SSH_DEST:?MOTIS_SSH_DEST in .env}
    volumes:
      - ./motis-link:/k:ro
    # Published on the opendata-net gateway: the reverse proxy is the only
    # thing that may reach it.
    ports: ["172.18.0.1:8086:8086"]
    networks: [transport]

  # The access log of the transport vhost: nginx sends it over syslog, this
  # keeps it as daily files for 30 days (access_log_receiver.py, from docker/
  # in the repository). It runs in the image of the Python service because
  # that has Python and the Zurich zone already.
  access-log:
    image: registry.gitlab.com/opendata.ch/transport/service:${SERVICE_IMAGE_TAG:-latest}
    restart: unless-stopped
    cgroup_parent: transport.slice
    user: root
    command: ["python", "/ops/access_log_receiver.py"]
    environment:
      LOG_DIR: /logs
      LOG_KEEP_DAYS: "30"
    volumes:
      - ./access_log_receiver.py:/ops/access_log_receiver.py:ro
      - accesslogs:/logs
    # The image's own check asks the API, which does not run here.
    healthcheck:
      disable: true
    ports: ["172.18.0.1:5514:5514/udp"]
    networks: [transport]

volumes:
  accesslogs:

networks:
  transport:
